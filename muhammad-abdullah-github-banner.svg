<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#0D2E4E"/>
    </linearGradient>

    <pattern id="gridMinor" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#12385C" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#gridMinor)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#1D4E78" stroke-width="1.2"/>
    </pattern>

    <path id="pulsePath" d="M 150 270 L 1450 270"/>

    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2E6488"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="400" fill="url(#bgGrad)"/>
  <rect width="1600" height="400" fill="url(#gridMajor)"/>

  <!-- outer frame -->
  <rect x="20" y="20" width="1560" height="360" fill="none" stroke="#2E6488" stroke-width="1.5"/>

  <!-- corner registration ticks -->
  <g stroke="#4FA0C9" stroke-width="1.5">
    <path d="M20,32 L20,20 L32,20"/>
    <path d="M1568,20 L1580,20 L1580,32"/>
    <path d="M20,368 L20,380 L32,380"/>
    <path d="M1580,368 L1580,380 L1568,380"/>
  </g>

  <!-- name -->
  <text x="70" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="58" letter-spacing="3" fill="#F2F8FC">MUHAMMAD ABDULLAH</text>
  <rect x="72" y="134" width="430" height="4" fill="#FFB454"/>

  <!-- terminal-style tagline -->
  <text x="70" y="172" font-family="'Courier New', Courier, monospace" font-size="22" fill="#7FC7E8">
    <tspan fill="#FFB454">$</tspan> whoami
  </text>
  <text x="70" y="202" font-family="'Courier New', Courier, monospace" font-size="22" fill="#EAF6FF">
    aspiring devops engineer — deploying pipelines, provisioning cloud<tspan fill="#FFB454">_
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <!-- stack line -->
  <text x="70" y="235" font-family="'Courier New', Courier, monospace" font-size="16" letter-spacing="1" fill="#5D89A8">DOCKER · KUBERNETES · TERRAFORM · AWS · CI/CD · LINUX · GIT</text>

  <!-- pipeline schematic -->
  <g>
    <line x1="150" y1="270" x2="1455" y2="270" stroke="#2E6488" stroke-width="2" stroke-dasharray="2 8" marker-end="url(#arrow)"/>

    <!-- traveling pulse -->
    <circle r="6" fill="#FFB454" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite">
        <mpath href="#pulsePath"/>
      </animateMotion>
    </circle>

    <!-- node: COMMIT -->
    <g transform="translate(150,270)">
      <circle r="20" fill="#0D2E4E" stroke="#7FC7E8" stroke-width="2"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#7FC7E8" stroke-width="2"/>
      <circle r="4" fill="#7FC7E8"/>
      <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#5D89A8">COMMIT</text>
    </g>

    <!-- node: BUILD -->
    <g transform="translate(475,270)">
      <circle r="20" fill="#0D2E4E" stroke="#7FC7E8" stroke-width="2"/>
      <g stroke="#7FC7E8" stroke-width="2">
        <circle r="7" fill="none"/>
        <line x1="0" y1="-11" x2="0" y2="-7"/>
        <line x1="0" y1="11" x2="0" y2="7"/>
        <line x1="-11" y1="0" x2="-7" y2="0"/>
        <line x1="11" y1="0" x2="7" y2="0"/>
        <line x1="-7.8" y1="-7.8" x2="-5" y2="-5"/>
        <line x1="7.8" y1="7.8" x2="5" y2="5"/>
        <line x1="7.8" y1="-7.8" x2="5" y2="-5"/>
        <line x1="-7.8" y1="7.8" x2="-5" y2="5"/>
      </g>
      <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#5D89A8">BUILD</text>
    </g>

    <!-- node: TEST -->
    <g transform="translate(800,270)">
      <circle r="20" fill="#0D2E4E" stroke="#7FC7E8" stroke-width="2"/>
      <path d="M -8,0 L -2,7 L 9,-8" fill="none" stroke="#7FC7E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#5D89A8">TEST</text>
    </g>

    <!-- node: DEPLOY -->
    <g transform="translate(1125,270)">
      <circle r="20" fill="#0D2E4E" stroke="#7FC7E8" stroke-width="2"/>
      <path d="M0,-11 L7,4 L2.5,4 L2.5,11 L-2.5,11 L-2.5,4 L-7,4 Z" fill="#7FC7E8"/>
      <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#5D89A8">DEPLOY</text>
    </g>

    <!-- node: MONITOR -->
    <g transform="translate(1450,270)">
      <circle r="20" fill="#0D2E4E" stroke="#7FC7E8" stroke-width="2"/>
      <path d="M -12,0 L -6,0 L -3,-8 L 2,8 L 5,0 L 12,0" fill="none" stroke="#7FC7E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="1.5" fill="#5D89A8">MONITOR</text>
    </g>
  </g>

  <!-- scale bar (bottom-left, blueprint stamp detail) -->
  <g transform="translate(70,340)" stroke="#3A6E92" stroke-width="1.5">
    <line x1="0" y1="0" x2="200" y2="0"/>
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="50" y1="-5" x2="50" y2="5"/>
    <line x1="100" y1="-5" x2="100" y2="5"/>
    <line x1="150" y1="-5" x2="150" y2="5"/>
    <line x1="200" y1="-5" x2="200" y2="5"/>
  </g>
  <text x="70" y="365" font-family="'Courier New', monospace" font-size="13" letter-spacing="1" fill="#3A6E92">SCALE 1:1</text>

  <!-- title block (bottom-right, blueprint stamp) -->
  <g transform="translate(1170,332)">
    <rect x="0" y="0" width="380" height="40" fill="#0A2540" stroke="#2E6488" stroke-width="1.2"/>
    <line x1="130" y1="0" x2="130" y2="40" stroke="#2E6488" stroke-width="1"/>
    <line x1="255" y1="0" x2="255" y2="40" stroke="#2E6488" stroke-width="1"/>

    <text x="10" y="15" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#5D89A8">PIPELINE</text>
    <text x="10" y="32" font-family="'Courier New', monospace" font-size="13" fill="#EAF6FF">MA-DEVOPS-01</text>

    <text x="140" y="15" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#5D89A8">STATUS</text>
    <circle cx="146" cy="28" r="4" fill="#4ADE80"/>
    <text x="155" y="32" font-family="'Courier New', monospace" font-size="13" fill="#EAF6FF">PASSING</text>

    <text x="265" y="15" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#5D89A8">REV</text>
    <text x="265" y="32" font-family="'Courier New', monospace" font-size="13" fill="#EAF6FF">2026.07</text>
  </g>
</svg>
